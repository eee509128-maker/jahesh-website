<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldStaff" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Central Staff Ball -->
    <circle cx="200" cy="55" r="14" fill="#ffffff" stroke="none" />
    
    <!-- Central Staff Rod -->
    <rect x="196" y="65" width="8" height="235" rx="4" fill="#ffffff" stroke="none" />
    <polygon points="194,300 206,300 200,315" fill="#ffffff" stroke="none" />

    <!-- Outspread Wings -->
    <!-- Left Wing -->
    <path d="M192,85 C160,50 110,45 65,75 C95,95 130,105 188,110 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    <path d="M185,112 C145,115 100,118 78,135 C115,145 155,140 185,130 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    <path d="M185,132 C155,145 120,155 105,170 C140,172 168,160 188,145 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Right Wing -->
    <path d="M208,85 C240,50 290,45 335,75 C305,95 270,105 212,110 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    <path d="M215,112 C255,115 300,118 322,135 C285,145 245,140 215,130 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    <path d="M215,132 C245,145 280,155 295,170 C260,172 232,160 212,145 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />

    <!-- Entwined Snakes (Double Helix) -->
    <!-- Left Snake Head -->
    <path d="M165,82 C168,76 182,78 190,86 C180,90 172,90 165,82 Z" fill="#ffffff" stroke="#ffffff" />
    <!-- Right Snake Head -->
    <path d="M235,82 C232,76 218,78 210,86 C220,90 228,90 235,82 Z" fill="#ffffff" stroke="#ffffff" />

    <!-- Coils -->
    <!-- Coil 1 -->
    <path d="M188,88 C160,105 155,140 200,160 C245,180 240,215 200,235 C160,255 160,285 200,300" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round" />
    <!-- Coil 2 -->
    <path d="M212,88 C240,105 245,140 200,160 C155,180 160,215 200,235 C240,255 240,285 200,300" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round" />
    
    <!-- Snake eyes -->
    <circle cx="174" cy="81" r="1.5" fill="#1e1b4b" stroke="none" />
    <circle cx="226" cy="81" r="1.5" fill="#1e1b4b" stroke="none" />
  </g>

  <!-- Persian Calligraphy "دانشکده دامپزشکی" -->
  <g fill="#ffffff" text-anchor="middle" font-family="'Vazirmatn', 'IranNastaliq', Tahoma, sans-serif" filter="url(#glow)">
    <text x="200" y="380" font-size="44" font-weight="900" letter-spacing="1">دانشکده دامپزشکی</text>
    <text x="200" y="420" font-size="18" font-weight="700" fill="#a7f3d0" letter-spacing="3">مرکز آموزشی، تحقیقاتی و درمانی</text>
  </g>
</svg>
