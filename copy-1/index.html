<script type="module">
    const supabaseUrl = 'https://your-supabase-url.supabase.co';
    const supabaseKey = 'your-anon-key';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const addEventListenerOnce = (element, eventType, handler) => {
        if (element && !element.hasAttribute('data-event-initialized')) {
            element.addEventListener(eventType, handler, true);
            element.setAttribute('data-event-initialized', 'true');
        }
    };

    const handleSignUp = async (e) => {
        e.preventDefault();
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        const { user, error } = await supabase.auth.signUp({ email, password });
        if (error) {
            console.error('SignUp Error:', error.message);
            document.getElementById('signup-error-message').innerHTML = error.message;
        } else {
            location.reload();
        }
    };

    const handleSignIn = async (e) => {
        e.preventDefault();
        const email = document.getElementById('signin-email').value;
        const password = document.getElementById('signin-password').value;

        const { user, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            console.error('SignIn Error:', error.message);
            document.getElementById('signin-error-message').innerHTML = error.message;
        } else {
            window.location.href = '/user-id?loggedin=true';
        }
    };

    const handleSignOut = async () => {
        const { error } = await supabase.auth.signOut();
        if (error) {
            console.error('SignOut Error:', error.message);
        } else {
            location.reload();
        }
    };

    supabase.auth.onAuthStateChange((event, session) => {
        const publicElements = document.querySelectorAll("[data-onlogin='hide']");
        const privateElements = document.querySelectorAll("[data-onlogin='show']");
        const url = new URL(window.location);
        const isLoggedInParamSet = url.searchParams.has('loggedin');

        if (session) {
            if (!isLoggedInParamSet) {
                handleSignOut();
                return;
            }
            privateElements.forEach(element => element.style.display = "initial");
            publicElements.forEach(element => element.style.display = "none");
            if(document.getElementById('SessionDisplay')) {
              document.getElementById('SessionDisplay').innerText = session.user.id;
            }
            url.searchParams.set('loggedin', 'true');
        } else {
            publicElements.forEach(element => element.style.display = "initial");
            privateElements.forEach(element => element.style.display = "none");
            url.searchParams.delete('loggedin');
            if (isLoggedInParamSet) {
                window.location.href = '/sign-in';
                return;
            }
        }

        window.history.replaceState({}, '', url);
    });

    const signUpForm = document.getElementById('form-signup-form');
    const signInForm = document.getElementById('form-signin-form');
    const signOutButton = document.getElementById('signout-button');

    addEventListenerOnce(signUpForm, 'submit', handleSignUp);
    addEventListenerOnce(signInForm, 'submit', handleSignIn);
    addEventListenerOnce(signOutButton, 'click', handleSignOut);
</script>-->
