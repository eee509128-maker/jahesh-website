    <script>
      // Auto-focus or open product if URL contains ?openProduct= or ?product=
      (function() {
        var params = new URLSearchParams(window.location.search);
        var targetProduct = params.get('openProduct') || params.get('product') || params.get('id');
        if (targetProduct) {
          var attempts = 0;
          var interval = setInterval(function() {
            attempts++;
            var cards = document.querySelectorAll('button, a, div[role="button"]');
            var found = false;
            for (var i = 0; i < cards.length; i++) {
              var text = (cards[i].innerText || '').toLowerCase();
              if (text.includes(targetProduct.toLowerCase()) || text.includes('شنتیا') || text.includes('املاک')) {
                cards[i].click();
                found = true;
                clearInterval(interval);
                break;
              }
            }
            if (attempts > 20 || found) clearInterval(interval);
          }, 300);
        }
      })();
    </script>
